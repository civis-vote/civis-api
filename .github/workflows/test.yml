name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip-tests]')"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_CM___GEMS__COMMUTATUS__COM: ${{ secrets.BUNDLE_CM___GEMS__COMMUTATUS__COM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (libvips)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42t64 || sudo apt-get install -y libvips42

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Set up test credentials
        run: |
          export RAILS_MASTER_KEY=$(openssl rand -hex 16)
          rm -f config/credentials.yml.enc
          bundle exec ruby -e "
            require 'active_support/encrypted_file'
            file = ActiveSupport::EncryptedFile.new(
              content_path: 'config/credentials.yml.enc',
              key_path: 'config/master.key',
              env_key: 'RAILS_MASTER_KEY',
              raise_if_missing_key: true
            )
            file.write('{}')
          "
          echo "RAILS_MASTER_KEY=$RAILS_MASTER_KEY" >> $GITHUB_ENV

      - name: Set up database
        run: |
          cp config/database.yml.ci config/database.yml
          # Rails boots cannot run before the schema exists: cm-admin's model
          # DSL (default_sort_columns -> model.columns) queries the DB at boot.
          # Create the database and load the schema without booting the app.
          bundle exec ruby -e "
            require 'active_record'
            require 'pg'
            require 'yaml'
            db_config = YAML.load_file('config/database.yml')['test']
            conn = PG.connect(host: db_config['host'], user: db_config['username'], password: db_config['password'], dbname: 'postgres')
            begin
              conn.exec(\"CREATE DATABASE #{db_config['database']}\")
            rescue PG::DuplicateDatabase
            end
            conn.close
            ActiveRecord::Base.establish_connection(db_config)
            ActiveRecord::Schema.verbose = false
            load 'db/schema.rb'
          "

      - name: Precompile assets
        run: RAILS_ENV=test bundle exec rails assets:precompile

      - name: Run RSpec tests
        run: bundle exec rspec
